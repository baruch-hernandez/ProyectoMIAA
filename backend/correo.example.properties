# Plantilla de la cuenta que manda los códigos de "¿Olvidaste tu contraseña?".
#
# 1. Copia este archivo como backend/correo.properties (ese NO se sube a git: lleva la contraseña).
# 2. Llena el usuario y la contraseña. La contraseña de aplicación se pasa por privado, nunca por git.
# 3. Reinicia el backend.
#
# Para crear una contraseña de aplicación de Gmail: activa la verificación en 2 pasos de la cuenta y
# entra a https://myaccount.google.com/apppasswords (son 16 caracteres).
# Con Outlook/Hotmail usen spring.mail.host=smtp-mail.outlook.com (también puerto 587).

spring.mail.host=smtp.gmail.com
spring.mail.username=
spring.mail.password=
