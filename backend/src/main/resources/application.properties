server.port=8500

# Configuración de Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/miaa
spring.datasource.username=postgres
# Cada quien pone la suya en la variable de entorno DB_PASSWORD; si no existe, se usa esta.
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT: firma y duración del token (24 h = 86400000 ms)
# El secreto se lee de la variable de entorno JWT_SECRET. El valor después de ":" es SOLO para desarrollo:
# en el servidor real definan JWT_SECRET con un valor propio (64 caracteres hexadecimales o más) y no lo suban a Git.
jwt.secret=${JWT_SECRET:404F635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# Protección del login contra fuerza bruta
# Rate limit: máximo de intentos de login por IP en cada ventana de tiempo (después responde 429)
miaa.login.max-por-ip=10
miaa.login.ventana-segundos=60
# Bloqueo de cuenta: contraseñas incorrectas seguidas antes de bloquearla, y por cuántos minutos (responde 423)
miaa.login.intentos-maximos=5
miaa.login.minutos-bloqueo=15
# Estado activo: sin latido en este tiempo = INACTIVO. La app manda uno cada segundo; si el
# celular se suspende sin poder avisar, a los 2 s sale inactivo. Con mala señal puede parpadear: súbelo a 3-5.
miaa.presencia.segundos-en-linea=2
# Orígenes del front que pueden llamar a la API (separados por coma), SIN perfil https.
# Formato exacto: esquema://host:puerto, sin "/" al final. Se aceptan comodines: http://192.168.*.*:5173
# (Con el perfil https manda el valor de application-https.properties, no este.)
miaa.cors.origenes=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

# HTTPS: ver application-https.properties (se activa con el perfil "https")
# Ubicación en vivo: segundos sin recibir la ubicación del celular para marcarlo "sin conexión"
# (el celular la manda cada segundo junto con el latido)
miaa.ubicacion.segundos-en-linea=2

# Aviso de privacidad: si cambias el texto (frontend/src/utils/avisoPrivacidad.ts), cambia también
# esta versión (y la del front) para que los notificadores lo vuelvan a aceptar
miaa.aviso-privacidad.version=2026-10

# Horas que tiene un notificador para editar o borrar un reporte después de enviarlo
miaa.reportes.horas-para-modificar=24

# Sprint 4: POST /reportes/sync (reportes guardados sin conexión, de 5 en 5, hasta 3 fotos cada uno).
# Cada foto llega en ~0.3-1.2 MB (ValidadorFotos admite hasta ~1.8 MB). Pasarse responde 413.
# OJO: Tomcat 10.1.42+ limita a 10 las partes por petición; si se actualiza, agreguen server.tomcat.max-part-count=40
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=40MB

# Perfil activo. Con "https" la API solo habla HTTPS y necesita backend/certificados/miaa-dev.p12
# (generar-certificado.ps1). Si un compañero no tiene el certificado, que comente esta línea.
spring.profiles.active=https
# OJO: "npm run dev:https" reenvía /api a https://localhost:8500, así que espera este perfil.
# Si alguien corre el backend SIN https (perfil default), debe arrancar el front con:
#   $env:MIAA_API_DESTINO="http://localhost:8500"; npm run dev:https
# o si no, Vite falla con "EPROTO ... packet length too long".