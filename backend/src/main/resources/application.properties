server.port=8500

# Configuración de Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/miaa
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT: firma y duración del token (24 h = 86400000 ms)
# El secreto se lee de la variable de entorno JWT_SECRET. El valor después de ":" es SOLO para desarrollo:
# en el servidor real definan JWT_SECRET con un valor propio (64 caracteres hexadecimales o más) y no lo suban a Git.
jwt.secret=${JWT_SECRET:404F635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# Protección del login contra fuerza bruta
# Rate limit: máximo de intentos de login por IP en cada ventana de tiempo (después responde 429)
miaa.login.max-por-ip=10
miaa.login.ventana-segundos=60
# Bloqueo de cuenta: contraseñas incorrectas seguidas antes de bloquearla, y por cuántos minutos (responde 423)
miaa.login.intentos-maximos=5
miaa.login.minutos-bloqueo=15

# Orígenes del front que pueden llamar a la API (separados por coma)
miaa.cors.origenes=http://localhost:5173,http://localhost:3000,https://localhost:5173

# HTTPS: ver application-https.properties (se activa con el perfil "https")
# Empleados: días sin iniciar sesión ni subir reportes para considerarlo INACTIVO
miaa.empleados.dias-inactivo=7

# Ubicación en vivo: segundos sin recibir la ubicación del celular para marcarlo "sin conexión"
# (el celular la manda cada ~20 s; 60 s da margen para una mala señal)
miaa.ubicacion.segundos-en-linea=60

# Aviso de privacidad: si cambias el texto (frontend/src/utils/avisoPrivacidad.ts), cambia también
# esta versión (y la del front) para que los lecturistas lo vuelvan a aceptar
miaa.aviso-privacidad.version=2026-10

# Horas que tiene un lecturista para editar o borrar un reporte después de enviarlo
miaa.reportes.horas-para-modificar=24
