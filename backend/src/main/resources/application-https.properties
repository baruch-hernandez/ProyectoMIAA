# ============================================================
# Perfil "https": la API solo atiende por HTTPS (TLS).
#   mvn spring-boot:run -Dspring-boot.run.profiles=https
# Antes, generen el certificado con:  .\generar-certificado.ps1   (carpeta backend)
#
# Esto es para DESARROLLO y pruebas en la red local (certificado autofirmado).
# En el servidor real lo normal es poner Nginx o Caddy enfrente con un certificado de
# Let's Encrypt, y dejar este perfil apagado (ver LEEME).
# ============================================================
server.port=8500
server.ssl.enabled=true
server.ssl.key-store=${MIAA_KEYSTORE:file:certificados/miaa-dev.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${MIAA_KEYSTORE_PASSWORD:miaa-dev}
server.ssl.key-alias=miaa

# El front también corre en https (npm run dev:https). Agreguen aquí la IP de su PC
# si van a probar desde el celular, p. ej. https://192.168.1.50:5173
miaa.cors.origenes=http://localhost:5173,https://localhost:5173,http://127.0.0.1:5173,https://127.0.0.1:5173