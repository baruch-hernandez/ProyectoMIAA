# ============================================================
# Perfil "https": Spring Boot atiende HTTPS (TLS) directamente.
#   .\mvnw spring-boot:run "-Dspring-boot.run.profiles=https"
# Antes, genera el certificado con:  .\generar-certificado.ps1   (carpeta backend)
#
# Para desarrollo, pruebas en la red local y demostraciones (certificado AUTOFIRMADO).
# En el servidor real se usa Caddy o Nginx enfrente con Let's Encrypt (ver despliegue/).
# ============================================================

# --- TLS en el puerto principal (8500): ese puerto YA NO acepta HTTP ---
server.port=8500
server.ssl.enabled=true
server.ssl.key-store=${MIAA_KEYSTORE:file:certificados/miaa-dev.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${MIAA_KEYSTORE_PASSWORD:miaa-dev}
server.ssl.key-alias=miaa
# Solo versiones seguras del protocolo (TLS 1.0 y 1.1 tienen fallas conocidas)
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# --- Redirección: http://...:8080 → https://...:8500 (config/RedireccionHttps.java) ---
# 0 = no abrir el puerto de redirección
miaa.https.puerto-redireccion=8090

# --- HSTS apagado aquí: es por host, y con "localhost" forzaría HTTPS en todos sus puertos ---
miaa.seguridad.hsts=false

# --- Orígenes del front (npm run dev:https) que pueden llamar a la API ---
# Formato EXACTO: https://host:puerto  (sin "/" al final). Se separan con coma.
# Se aceptan comodines (*) para la red de la escuela/oficina, donde la IP cambia sola:
#   https://144.46.*.*:5173   → cualquier PC de esa red con el front en el 5173
# Si usan el proxy de Vite (VITE_API_URL=/api/v1, como viene en .env.https), CORS ni
# siquiera entra en juego: el navegador solo le habla a Vite.
miaa.cors.origenes=https://localhost:5173,https://127.0.0.1:5173,https://144.46.*.*:5173,https://192.168.*.*:5173
